# Netlify configuration — FacePay MX
# Docs: https://docs.netlify.com/frameworks/next-js/overview/
#
# Monorepo rules (verified against Netlify's docs and the Next runtime source):
#   • Base directory:        leave EMPTY (repo root) so `bun install` finds bun.lockb
#   • Package directory:     leave EMPTY
#   • Build command:         taken from here
#   • Publish directory:     apps/web/.next  ← the runtime derives the app dir from it
# This file covers Base directory = repo root. If Netlify's monorepo detection sets
# Base directory = apps/web (the usual result of picking the app in the UI), the
# config in apps/web/netlify.toml is used instead and this one is ignored.
# Keep the two files in sync (headers, env, plugin).

[build]
  command = "bun install --frozen-lockfile && bun run models:sync && bun run check:env && bun run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.1.34"
  NEXT_TELEMETRY_DISABLED = "1"

# Official Next.js runtime (App Router, Route Handlers, ISR, middleware).
[[plugins]]
  package = "@netlify/plugin-nextjs"

[dev]
  command = "bun run dev"
  targetPort = 3000
  framework = "next"

# ── Security headers ─────────────────────────────────────────────────────────
# The kiosk needs the camera; everything else is denied by default.
# CSP notes:
#   'wasm-unsafe-eval'  → TensorFlow.js / ONNX Runtime WebAssembly
#   worker-src blob:    → TFJS web workers
#   data:/blob: img-src → QR rendering + model canvases
#   supabase domains    → REST, Auth, Realtime (wss)
# Tighten with nonces once the CSP is verified against a production build.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-DNS-Prefetch-Control = "off"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Face models are immutable and large: cache them hard.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
